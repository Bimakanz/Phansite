; PHP 8.4 production tuning — Phansite (project kecil, single container)
; Upload: validasi Laravel 4MB -> beri headroom 8M/10M agar tidak 413
memory_limit = 256M
upload_max_filesize = 8M
post_max_size = 10M
max_file_uploads = 10
max_execution_time = 60
max_input_time = 60

; OPcache + JIT (multithread friendly, worker reuse)
opcache.enable = 1
opcache.enable_cli = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
opcache.jit = tracing
opcache.jit_buffer_size = 64M

; Security / correctness behind Caddy
expose_php = 0
date.timezone = UTC
